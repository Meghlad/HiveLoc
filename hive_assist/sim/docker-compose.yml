# D4.1 — 20-vehicle SITL stack for the ASUS Zephyrus (Linux + NVIDIA + Docker).
#
# RUNS ON THE ZEPHYRUS, NOT ON THE MACHINE THIS WAS WRITTEN ON. macOS cannot run
# gz-sim headless against NVIDIA, and `tc netem` needs Linux veth pairs. Check
# the host first:
#
#     ./preflight.sh
#
# THE BINDING CONSTRAINT IS 16 GB OF RAM, and the single biggest win is right
# here in the topology: ONE gz-sim server hosting all M models, not M servers.
# Launching one Gazebo per vehicle is the obvious-looking arrangement and it is
# what puts this stack 20 GB over budget.
#
#   PX4 SITL x20 (~250-400 MB ea)          6-8 GB
#   gz-sim server (headless, sensors cut)  2-4 GB
#   ROS 2 + DDS + our nodes                1-2 GB
#   OS                                     ~2 GB
#   -------------------------------------------
#   total                                  ~13-15 GB
#
# That leaves ~1-3 GB of headroom, which is not enough to absorb a leak, so
# preflight.sh insists on an 8 GB swapfile before it will pass.
#
#   docker compose up --build            bring the stack up
#   docker compose up --scale px4=8      fewer vehicles (start here, then climb)
#   docker compose down -v               tear down
#
# The supervisor is deliberately NOT in this file. It runs natively on the host
# under a cpuset with nice -5, because it is the only component that can emit a
# setpoint and it should not be sharing a scheduler with twenty flight stacks.
# See run_supervisor.sh.

name: hive-assist-sim

x-common: &common
  restart: "no"
  networks: [swarmnet]
  environment:
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
    RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
    # Cyclone reads this to stay off the host's other interfaces; a 20-vehicle
    # participant table on a shared domain is how discovery traffic eats a core.
    CYCLONEDDS_URI: "file:///config/cyclonedds.xml"
  volumes:
    - ./config:/config:ro

services:
  # ------------------------------------------------------------------ physics
  gz-server:
    <<: *common
    image: gazebo:harmonic
    container_name: hive-gz
    command: >
      gz sim -s -r -v2 --headless-rendering
      /config/worlds/anchor_site.sdf
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///config/cyclonedds.xml"
      # cameras are the VRAM killers on an 8 GB 4060: only the ACTIVE drones get
      # depth/RGB, the loiter mesh runs kinematic + range-only
      HIVE_CAMERA_VEHICLES: "${HIVE_CAMERA_VEHICLES:-1,2}"
    deploy:
      resources:
        limits: {memory: 4g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ------------------------------------------------------------- flight stacks
  # `--scale px4=20`. Each replica reads its instance index from the hostname,
  # so there is exactly one service definition regardless of fleet size.
  px4:
    <<: *common
    image: px4io/px4-dev-simulation-jammy:latest
    depends_on: [gz-server]
    command: ["/config/px4_entrypoint.sh"]
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///config/cyclonedds.xml"
      PX4_SIM_MODEL: "gz_x500"
      PX4_GZ_STANDALONE: "1"           # attach to the shared server, never spawn
      PX4_GZ_WORLD: "anchor_site"
    deploy:
      replicas: ${HIVE_N_VEHICLES:-20}
      resources:
        limits: {memory: 420m}         # trips the OOM killer before the host

  # --------------------------------------------------------------------- bridge
  ros-gz-bridge:
    <<: *common
    image: hive-assist/ros2:jazzy
    build:
      context: ..
      dockerfile: sim/Dockerfile
    container_name: hive-bridge
    depends_on: [gz-server]
    command: >
      ros2 launch hive_bringup bridge.launch.py
      n_vehicles:=${HIVE_N_VEHICLES:-20}
    deploy:
      resources:
        limits: {memory: 1g}

  # ------------------------------------------------------------------ our nodes
  hive-fsm:
    <<: *common
    image: hive-assist/ros2:jazzy
    container_name: hive-fsm
    depends_on: [ros-gz-bridge]
    command: >
      ros2 launch hive_bringup mission.launch.py
      n_vehicles:=${HIVE_N_VEHICLES:-20}
      anchor_lat:=${HIVE_ANCHOR_LAT:-47.397742}
      anchor_lon:=${HIVE_ANCHOR_LON:-8.545594}
      anchor_alt:=${HIVE_ANCHOR_ALT:-488.0}
    deploy:
      resources:
        limits: {memory: 1g}

  # -------------------------------------------------------------- fault injector
  # NET_ADMIN + host netns: netem has to reach the veth pairs the other
  # containers are on. Off by default — bring it up only for a sweep.
  netem:
    image: hive-assist/ros2:jazzy
    container_name: hive-netem
    network_mode: host
    cap_add: [NET_ADMIN]
    profiles: [faults]
    volumes:
      - ./:/sim:ro
    command: ["/sim/netem_sweep.sh", "--auto"]

networks:
  swarmnet:
    driver: bridge
